[workspace]
members = ["crates/*", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/auroravnliems/ShunguangDecor"

[workspace.dependencies]
sg-core = { path = "crates/sg-core" }
sg-cursor = { path = "crates/sg-cursor" }
sg-desktop = { path = "crates/sg-desktop" }
sg-capture = { path = "crates/sg-capture" }
sg-wallpaper = { path = "crates/sg-wallpaper" }
sg-explorer-proto = { path = "crates/sg-explorer-proto" }
sg-explorer = { path = "crates/sg-explorer" }
sg-labels = { path = "crates/sg-labels" }
sg-taskbar = { path = "crates/sg-taskbar" }
sg-features = { path = "crates/sg-features" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
tracing = "0.1"
windows = "0.62"

# Do not use panic = "abort": ModuleHost needs catch_unwind so a failing module does not take down the whole app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Debug builds: third-party libraries do not need debug info (the `windows` crate with many features + Tauri push
# `target/debug/deps` to ~20 GB); the project's own crates keep full info so backtraces have line numbers.
[profile.dev.package."*"]
debug = false

# Debug builds: desktop capture (downscaling, per-pixel color changes) is dozens of times slower without optimization.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.sg-capture]
opt-level = 2
