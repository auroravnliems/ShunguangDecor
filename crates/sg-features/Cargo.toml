[package]
name = "sg-features"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hidden Features (ViVe port to Rust): model, dictionary, undo journal, export/import"

[dependencies]
sg-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [ "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging" ] }
