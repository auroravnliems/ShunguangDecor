# Feature suggestions. Each entry has passed 3 verification conditions:
#   1) id + name exist in FeatureDictionary.pfs (test `suggestions_exist_in_dictionary` enforces this);
#   2) the configuration exists on a build 26200 machine via RtlQueryAllFeatureConfigurations
#      (`cargo test -p sg-features --test suggestions_real_machine -- --ignored`, read-only);
#   3) the effect is publicly described by several sources (listed in the `source` field).
# Display name/description come from the keys `features.suggest.<id>.name` / `.desc` in src/locales/*.json.

# Only claims the battery icon style change. Sources say the show-battery-percentage option usually also needs ID 48433719
