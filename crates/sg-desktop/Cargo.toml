[package]
name = "sg-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Monitors and Explorer's desktop layers (Progman/WorkerW), shared by desktop capture, wallpaper, labels and taskbar"

[dependencies]
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
